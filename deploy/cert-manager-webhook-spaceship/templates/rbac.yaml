apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceship.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}:auth-delegator
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceship.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["acme.spaceship.com"]
  resources: ["spaceship"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["acme.cert-manager.io"]
  resources: ["challenges"]
  verbs: ["get", "list", "watch", "update"]
  # - apiGroups:
  #     - {{ .Values.groupName }}
  #   resources:
  #     - '*'
  #   verbs:
  #     - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-spaceship.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceship.fullname" . }}
    namespace: {{ .Values.certManager.namespace }}
